name: Autonomous Job Scout Agent

on:
  schedule:
    - cron: '47 2 * * *'   # 08:17 AM IST
    - cron: '7 9 * * *'    # 02:37 PM IST
    - cron: '53 14 * * *'  # 08:23 PM IST
  workflow_dispatch:          # Allows manual trigger anytime from GitHub web/mobile UI

permissions:
  contents: write

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  run-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: python -m pytest tests/test_scout_agent.py -q

      - name: Run Job Scout Agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: "Shivank Shukla"
          CANDIDATE_PORTFOLIO: "https://shivank-shukla-portfolio.vercel.app/"
          CANDIDATE_LINKEDIN: "https://www.linkedin.com/in/shivank-shukla09"
          CANDIDATE_EMAIL: "work.shuklashivank@gmail.com"
          CANDIDATE_PHONE: "+91 9013584218"
          CANDIDATE_GITHUB: "https://github.com/shukla009"
          MAX_POST_AGE_DAYS: "4"
          MAX_POST_AGE_HOURS: "48"
          MAX_DIRECT_APPLY_AGE_DAYS: "21"
          MAX_APPLY_ALERTS: "5"
          MAX_EMAILS_PER_RUN: "3"
          MAX_EMAILS_PER_DAY: "6"
          MAX_FOLLOWUPS_PER_RUN: "2"
          RECIPIENT_COOLDOWN_DAYS: "30"
          MIN_APPLY_SCORE: "54"
          MIN_EMAIL_SCORE: "58"
          MAX_CANDIDATES_PER_RUN: "50"
          HTTP_RETRIES: "2"
          FOLLOW_UP_OFFSETS_DAYS: "4,9"
          SEND_EMAILS: "true"
          SMTP_PREFLIGHT: "true"
          IMAP_CHECK: "true"
          USE_LLM_REVIEW: "false"
        run: python scout_agent.py

      - name: Commit & Push Durable Agent State
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -- applied_history.json follow_up.json suppressed_emails.json
          git diff --cached --quiet || (git commit -m "update: job scout state [skip ci]" && git push)

  refresh-naukri:
    # Independent from run-scout: a Naukri login failure cannot stop scouting.
    if: vars.NAUKRI_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      NAUKRI_REFRESH_ENABLED: "true"
      NAUKRI_EXPECTED_EMAIL: "work.shuklashivank@gmail.com"
      NAUKRI_RECOVERY_PATH: ".naukri-private/recovery.enc"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated refresh dependencies
        run: python -m pip install -r requirements-naukri.txt
      - name: Run refresh regression tests
        run: python -m pytest tests/test_naukri_refresh.py tests/test_naukri_session_setup.py tests/test_naukri_notifications.py -q
      - name: Verify configuration
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_RECOVERY_KEY: ${{ secrets.NAUKRI_RECOVERY_KEY }}
        run: |
          python -c "import os; from naukri_refresh import validate_storage_state, EncryptedJournal; validate_storage_state(os.environ.get('NAUKRI_STORAGE_STATE', '')); EncryptedJournal(os.environ['NAUKRI_RECOVERY_PATH'], os.environ.get('NAUKRI_RECOVERY_KEY', '')); print('Naukri configuration validated')"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Restore encrypted recovery record
        uses: actions/cache/restore@v4
        with:
          path: .naukri-private/recovery.enc
          key: naukri-recovery-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-lookup
          restore-keys: |
            naukri-recovery-v1-${{ github.ref_name }}-
      - name: Prepare refresh and recover interrupted edit
        id: prepare
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_RECOVERY_KEY: ${{ secrets.NAUKRI_RECOVERY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naukri_refresh.py --prepare
      - name: Back up prepared recovery record before editing
        uses: actions/cache/save@v4
        with:
          path: .naukri-private/recovery.enc
          key: naukri-recovery-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
      - name: Confirm recovery backup exists
        id: backup
        uses: actions/cache/restore@v4
        with:
          path: .naukri-private/recovery.enc
          key: naukri-recovery-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          fail-on-cache-miss: true
      - name: Refresh and restore original summary
        if: steps.backup.outputs.cache-hit == 'true'
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_RECOVERY_KEY: ${{ secrets.NAUKRI_RECOVERY_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naukri_refresh.py --execute
      - name: Save final encrypted recovery state
        if: always() && hashFiles('.naukri-private/recovery.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .naukri-private/recovery.enc
          key: naukri-recovery-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}-final
      - name: Publish redacted result to job summary
        if: always()
        run: |
          python -c "import os,json,pathlib; p=pathlib.Path('naukri_refresh_report.json'); r=json.loads(p.read_text()) if p.exists() else {'status':'setup_or_backup_failed'}; pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a').write('### Naukri refresh\n\n' + '\n'.join('- ' + str(k) + ': ' + str(v) for k,v in r.items()) + '\n')"
      - name: Notify Telegram if infrastructure or setup failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import json,pathlib; from naukri_refresh import _notify; p=pathlib.Path('naukri_refresh_report.json'); r=json.loads(p.read_text()) if p.exists() else {'status':'workflow_failed'}; r.update(status='backup_failed') if r.get('status')=='prepared' else None; _notify(r) if not r.get('telegram_notified') else None"


