name: Autonomous Job Scout Agent

on:
  schedule:
    - cron: '17 3,9,15 * * *' # 08:47, 14:47, 20:47 IST; delayed starts are accepted.
  workflow_dispatch:          # Allows manual trigger anytime from GitHub web/mobile UI
    inputs:
      verify_schedule:
        description: Apply scheduled-run cadence checks to this manual validation run
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  run-scout:
    # Enable only after account billing is verified to stop paid overages.
    if: vars.ZERO_COST_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      # Push/PR CI runs the complete Python and Worker regression suites.
      # Scheduled runs only need a fast integrity check, preserving free minutes.
      - name: Verify Runtime Imports
        run: |
          python -m compileall -q scout_agent.py scout_mail.py scout_matching.py scout_persistence.py scout_runtime.py scout_sources.py scout_state.py scout_storage.py scout_discovery.py scout_applications.py scout_personalization.py scout_schedule.py scout_contacts.py scout_actions.py
          python -c "import scout_agent, scout_mail, scout_matching, scout_persistence, scout_runtime, scout_sources, scout_state, scout_storage, scout_discovery, scout_applications, scout_personalization, scout_schedule, scout_contacts, scout_actions"

      - name: Run Job Scout Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZERO_COST_VERIFIED: ${{ vars.ZERO_COST_VERIFIED }}
          TELEGRAM_TRACKING_READY: ${{ vars.TELEGRAM_TRACKING_READY || 'false' }}
          ENABLE_JOB_ALERT_EMAILS: ${{ vars.ENABLE_JOB_ALERT_EMAILS || 'true' }}
          HANDS_OFF_ONLY: "true"
          SCOUT_OPTIONAL_ACTIONS: "true"
          SCOUT_ENCRYPT_STATE: ${{ vars.SCOUT_ENCRYPT_STATE || 'false' }}
          SCOUT_STATE_KEY: ${{ secrets.SCOUT_STATE_KEY }}
          SCOUT_APPLICATION_ANSWERS: ${{ secrets.SCOUT_APPLICATION_ANSWERS }}
          SCOUT_ALERT_SENDER_DOMAINS: ${{ vars.SCOUT_ALERT_SENDER_DOMAINS || '' }}
          SCOUT_SHADOW_RUNS: "3"
          SCOUT_VERIFY_SCHEDULE: ${{ inputs.verify_schedule || 'false' }}
          NVIDIA_API_KEY: ""
          SERPAPI_KEY: ""
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: "Shivank Shukla"
          CANDIDATE_PORTFOLIO: "https://shivank-shukla-portfolio.vercel.app/"
          CANDIDATE_LINKEDIN: "https://www.linkedin.com/in/shivank-shukla09"
          CANDIDATE_EMAIL: "work.shuklashivank@gmail.com"
          CANDIDATE_PHONE: "+91 9013584218"
          CANDIDATE_GITHUB: "https://github.com/shukla009"
          MAX_POST_AGE_DAYS: "4"
          MAX_POST_AGE_HOURS: "48"
          MAX_DIRECT_APPLY_AGE_DAYS: "21"
          MAX_APPLY_ALERTS: "5"
          MAX_EMAILS_PER_RUN: "3"
          MAX_EMAILS_PER_DAY: "6"
          MAX_FOLLOWUPS_PER_RUN: "2"
          RECIPIENT_COOLDOWN_DAYS: "30"
          # Legacy compatibility; matching enforces core 70/stretch 60 itself.
          MIN_APPLY_SCORE: "70"
          MIN_EMAIL_SCORE: "70"
          MAX_CANDIDATES_PER_RUN: "80"
          HTTP_RETRIES: "2"
          FOLLOW_UP_OFFSETS_DAYS: "4,9"
          SEND_EMAILS: "true"
          SMTP_PREFLIGHT: "true"
          IMAP_CHECK: "true"
          USE_LLM_REVIEW: "false"
        run: python scout_agent.py

      # Runtime persists state before outreach using latest-tree, non-force CAS.
      # No post-run git push: it could overwrite concurrent Telegram feedback.
