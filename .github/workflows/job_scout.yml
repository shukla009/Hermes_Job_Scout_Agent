name: Autonomous Job Scout Agent

on:
  schedule:
    - cron: '0 3 * * *'   # 08:30 AM IST (once per day)
  workflow_dispatch:          # Allows manual trigger anytime from GitHub web/mobile UI

permissions:
  contents: write

concurrency:
  group: job-scout
  cancel-in-progress: true

jobs:
  run-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests (mocked, no network)
        run: |
          pip install pytest -q
          python -m pytest test_scout_agent.py -v

      - name: Run Job Scout Agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: "Shivank Shukla"
          CANDIDATE_PORTFOLIO: "https://shivank-shukla-portfolio.vercel.app/"
          CANDIDATE_LINKEDIN: "https://www.linkedin.com/in/shivank-shukla09"
          CANDIDATE_EMAIL: "work.shuklashivank@gmail.com"
          CANDIDATE_PHONE: "+91 9013584218"
          CANDIDATE_GITHUB: "https://github.com/shukla009"
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          MAX_POST_AGE_DAYS: "4"
        run: python scout_agent.py

      - name: Commit & Push Updated Applied History
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applied_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: applied jobs history [skip ci]" && git push)
