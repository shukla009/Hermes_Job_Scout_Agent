name: Autonomous Job Scout Agent

on:
  schedule:
    - cron: '0 3 * * *'   # 08:30 AM IST
    - cron: '0 15 * * *'  # 08:30 PM IST
  workflow_dispatch:          # Allows manual trigger anytime from GitHub web/mobile UI

jobs:
  run-scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scout Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_NAME: "Shivank Shukla"
          CANDIDATE_PORTFOLIO: "https://shivank-shukla-portfolio.vercel.app/"
          CANDIDATE_LINKEDIN: "https://www.linkedin.com/in/shivank-shukla09"
        run: python scout_agent.py

      - name: Commit & Push Updated Applied History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add applied_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: applied jobs history [skip ci]" && git push)
