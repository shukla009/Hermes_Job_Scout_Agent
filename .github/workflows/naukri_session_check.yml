name: Check Naukri Session (read only)

on:
  workflow_dispatch:
    inputs:
      browser_environment:
        description: Standard browser environment to validate
        type: choice
        options:
          - windows-chrome
          - ubuntu-chromium
          - ubuntu-selenium
        default: windows-chrome

permissions:
  contents: read

jobs:
  check-session:
    runs-on: ${{ inputs.browser_environment == 'windows-chrome' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-naukri.txt
      - if: inputs.browser_environment == 'ubuntu-chromium'
        run: python -m playwright install --with-deps chromium
      - name: Install Selenium and virtual display
        if: inputs.browser_environment == 'ubuntu-selenium'
        run: |
          python -m pip install -r requirements-naukri-selenium.txt
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y xvfb
          google-chrome --version
      - name: Run Selenium safety tests
        if: inputs.browser_environment == 'ubuntu-selenium'
        run: python -m pytest tests/test_naukri_selenium_check.py -q
      - name: Verify cloud login without changing profile
        if: inputs.browser_environment != 'ubuntu-selenium'
        env:
          NAUKRI_REFRESH_ENABLED: "true"
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_EXPECTED_EMAIL: "work.shuklashivank@gmail.com"
          NAUKRI_BROWSER_CHANNEL: ${{ inputs.browser_environment == 'windows-chrome' && 'chrome' || 'chromium' }}
          NAUKRI_HEADLESS: ${{ inputs.browser_environment == 'windows-chrome' && 'false' || 'true' }}
          NAUKRI_DISABLE_HTTP2: ${{ inputs.browser_environment == 'windows-chrome' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naukri_refresh.py --check-session
      - name: Verify Selenium login and summary without changing profile
        if: inputs.browser_environment == 'ubuntu-selenium'
        env:
          NAUKRI_REPORT_PATH: "naukri_refresh_report.json"
          NAUKRI_DISABLE_HTTP2: "true"
          NAUKRI_USERNAME: "work.shuklashivank@gmail.com"
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_EXPECTED_EMAIL: "work.shuklashivank@gmail.com"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python naukri_selenium_check.py
      - name: Notify Telegram if setup failed before checking login
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "import json,pathlib; from naukri_refresh import _notify; p=pathlib.Path('naukri_refresh_report.json'); r=json.loads(p.read_text()) if p.exists() else {'status':'workflow_failed'}; _notify(r) if not r.get('telegram_notified') else None"
