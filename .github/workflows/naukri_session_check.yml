name: Check Naukri Session (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-naukri.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify cloud login without changing profile
        env:
          NAUKRI_REFRESH_ENABLED: "true"
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
          NAUKRI_EXPECTED_EMAIL: "work.shuklashivank@gmail.com"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naukri_refresh.py --check-session
