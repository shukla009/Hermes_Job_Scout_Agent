name: Secure existing Telegram webhook

on:
  workflow_dispatch:
    inputs:
      verify_dispatch:
        description: Also verify /run by starting one scout run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure:
    if: vars.ZERO_COST_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Configure and verify the existing webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_DISPATCH: ${{ inputs.verify_dispatch }}
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error, re
          token = os.environ['BOT_TOKEN']
          secret = os.environ['WEBHOOK_SECRET']
          chat = os.environ['CHAT_ID']
          assert token and secret and chat, 'Existing bot secrets are required'
          url = 'https://telegram-job-scout-trigger.ranjitrana-rana123.workers.dev/'
          def call(method, body=None):
              request = urllib.request.Request('https://api.telegram.org/bot' + token + '/' + method,
                  data=json.dumps(body or {}).encode(), headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      result = json.load(response)
              except Exception:
                  raise RuntimeError('Telegram configuration request failed') from None
              assert result.get('ok'), 'Telegram operation was not accepted'
              return result.get('result')
          call('setWebhook', {'url':url, 'secret_token':secret,
              'allowed_updates':['message','callback_query'], 'drop_pending_updates':False})
          info = call('getWebhookInfo')
          assert info.get('url') == url and 'callback_query' in info.get('allowed_updates', []), 'Webhook verification failed'
          call('setMyCommands', {'commands': [
              {'command':'run', 'description':'Start the cloud job scout'},
              {'command':'status', 'description':'Latest search, reachability and rollout'},
              {'command':'queue', 'description':'Automatic applications and outcomes'},
              {'command':'actions', 'description':'Optional phone actions, not approvals'},
              {'command':'stats', 'description':'Applications, replies and interviews'}]})
          print('Existing webhook secured; messages and callbacks enabled. No secret values logged.')
          # A read-only command probes Worker authentication and existing GitHub access.
          commands = ['/status', '/stats', '/queue', '/actions']
          if os.getenv('VERIFY_DISPATCH', '').lower() == 'true':
              commands.append('/run')
          identity = int(time.time() * 1000)
          for index, command in enumerate(commands):
              request = urllib.request.Request(url, data=json.dumps({
                  'update_id':identity + index, 'message':{'chat':{'id':chat},
                  'from':{'id':chat}, 'text':command}}).encode(), headers={
                  'Content-Type':'application/json', 'User-Agent':'Hermes-Job-Scout-Webhook-Verification/1.0',
                  'X-Telegram-Bot-Api-Secret-Token':secret})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert response.status == 200, 'Worker command check failed'
              except urllib.error.HTTPError as error:
                  print('Worker check returned HTTP', error.code)
                  body = error.read(200).decode(errors='replace').strip()
                  print('Response category:', body if body in ('Forbidden', 'Method not allowed', 'Temporary service failure') or re.fullmatch(r'state_read_http_\d{3}', body) else 'Upstream HTTP denial')
                  raise RuntimeError('Secured Worker command check failed; inspect configuration') from None
              except Exception:
                  raise RuntimeError('Secured Worker command check failed; inspect configuration') from None
              print(command, 'accepted; check Telegram for its response.')
