name: Automation Regression Tests

on:
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'workers/**.js'
      - 'tests/**.mjs'
      - 'config/**'
      - 'Shivank_Shukla_Data_Analyst.pdf'
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
      - 'workers/**.js'
      - 'tests/**.mjs'
      - 'config/**'
      - 'Shivank_Shukla_Data_Analyst.pdf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Test job scouting
        run: python -m pytest tests -q
      - name: Test Telegram worker feedback and dispatch
        run: |
          node tests/worker_test.mjs
          node tests/manual_card_test.mjs
