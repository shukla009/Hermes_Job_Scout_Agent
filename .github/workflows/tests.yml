name: Automation Regression Tests

on:
  push:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.py'
      - 'requirements*.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-naukri.txt -r requirements-naukri-selenium.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test scouting and offline Naukri editor
        run: python -m pytest tests -q
