name: Free contact backend verification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scout
  cancel-in-progress: false

jobs:
  public-backends:
    if: vars.ZERO_COST_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify free backends (public test queries, no Gmail access)
        id: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZERO_COST_VERIFIED: ${{ vars.ZERO_COST_VERIFIED }}
          SCOUT_ENCRYPT_STATE: ${{ vars.SCOUT_ENCRYPT_STATE || 'false' }}
          SCOUT_STATE_KEY: ${{ secrets.SCOUT_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scout_contact_search.py --record-cloud-check
      - name: Require both free backends
        env:
          VERIFIED: ${{ steps.backend.outputs.verified }}
        run: test "$VERIFIED" = "true"
